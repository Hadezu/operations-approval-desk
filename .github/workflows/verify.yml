name: Verify approval desk
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: approval_desk
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d approval_desk"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGDATABASE: approval_desk
      PGUSER: postgres
      PGPASSWORD: disposable-ci-password
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      DJANGO_SECRET_KEY: disposable-ci-only-secret-not-for-hosting-20261005
      DEMO_PASSWORD: disposable-ci-only-demo-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python manage.py check && uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q --junitxml=test-results/unit.xml
      - name: Migration reverse and forward
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate desk zero --noinput
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_demo
          uv run python manage.py collectstatic --noinput
      - run: uv run playwright install --with-deps chromium
      - name: Browser acceptance with real HTTP and PostgreSQL
        run: |
          uv run python -m scripts.serve > test-results/server.log 2>&1 &
          uv run python scripts/browser_check.py
      - name: Container smoke
        run: |
          uv run python scripts/configure.py
          unset PGDATABASE PGUSER PGPASSWORD PGHOST PGPORT DJANGO_SECRET_KEY DEMO_PASSWORD
          docker compose up -d --build
          for attempt in $(seq 1 40); do
            if curl --fail http://127.0.0.1:8188/health/; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8188/health/
          docker compose exec -T web uv run --no-dev python manage.py check
          docker compose exec -T web uv run --no-dev python manage.py seed_demo
        env:
          # Native browser server uses port 8187; compose has a separate override below.
          COMPOSE_FILE: compose.yml:compose.ci.yml
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: approval-desk-evidence-py${{ matrix.python }}
          path: test-results/
          retention-days: 14
