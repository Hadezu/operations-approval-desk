[project]
name = "operations-approval-desk"
version = "0.1.0"
description = "A PostgreSQL-backed internal approval desk with scoped permissions and versioned decisions"
requires-python = ">=3.12,<3.15"
dependencies = ["Django>=5.2.8,<5.3", "psycopg[binary]>=3.2,<4", "waitress>=3,<4", "whitenoise>=6.9,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
